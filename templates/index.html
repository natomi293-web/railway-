<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像推論</title>
</head>
<body>
 
<h1>画像推論</h1>
 
<form action="/predict" method="post" enctype="multipart/form-data">
 
<label for="image">画像を選択</label>
<br><br>
 
<input
type="file"
id="image"
name="image"
accept="image/*"
required
>
 
<br><br>
 
<button type="submit">
推論開始
</button>
 
</form>
 
</body>
</html>
